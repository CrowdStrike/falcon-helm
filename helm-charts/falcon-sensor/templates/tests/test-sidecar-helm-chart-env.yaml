{{- if .Values.testing.enabled -}}
{{- if .Values.container.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "falcon-sensor.fullname" . }}-test-sidecar-helm-chart-env"
  namespace: {{ include "falcon-sensor.namespace" . }}
  labels:
    {{- include "falcon-sensor.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
    sensor.falcon-system.crowdstrike.com/injection: disabled
spec:
  containers:
    - name: kubectl
      image: docker.io/bitnami/kubectl
      imagePullPolicy: IfNotPresent
      command:
      - /bin/sh
      - -c
      - |
        FAILED=0
        EXPECTED_CHART="{{ include "falcon-sensor.chart" . }}"

        echo "--- Waiting for injector Deployment pods to initialize ---"
        kubectl wait deployment \
          "{{ include "falcon-sensor.name" . }}-injector" \
          -n "{{ include "falcon-sensor.namespace" . }}" \
          --for=condition=Available \
          --timeout=300s

        PODS=$(kubectl get pods -n "{{ include "falcon-sensor.namespace" . }}" \
          -l "app.kubernetes.io/component=container_sensor" \
          -o jsonpath="{.items[*].metadata.name}" 2>&1)
        if [ -z "${PODS}" ]; then
            echo "[FAIL]: No injector pods found"
            exit 1
        fi

        echo "--- Checking HELM_CHART env var in injector pod spec ---"
        for POD in ${PODS}; do
            ENV_NAME=$(kubectl get pod "${POD}" \
              -n "{{ include "falcon-sensor.namespace" . }}" \
              -o jsonpath='{.spec.containers[0].env[?(@.name=="HELM_CHART")].name}' 2>&1)
            if [ "${ENV_NAME}" != "HELM_CHART" ]; then
                echo "[FAIL]: Pod '${POD}' does not have HELM_CHART env var defined"
                FAILED=1
                continue
            fi
            echo "[OK]: Pod '${POD}' has HELM_CHART env var defined in spec"

            # Verify the fieldRef resolves to the expected helm.sh/chart label value
            CHART_LABEL=$(kubectl get pod "${POD}" \
              -n "{{ include "falcon-sensor.namespace" . }}" \
              -o jsonpath="{.metadata.labels.helm\.sh/chart}" 2>&1)
            if [ "${CHART_LABEL}" != "${EXPECTED_CHART}" ]; then
                echo "[FAIL]: Pod '${POD}' helm.sh/chart label is '${CHART_LABEL}', expected '${EXPECTED_CHART}'"
                FAILED=1
            else
                echo "[OK]: Pod '${POD}' helm.sh/chart='${CHART_LABEL}' matches expected value"
            fi
        done

        if [ "${FAILED}" -eq 1 ]; then
            exit 1
        fi
        exit 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  serviceAccountName: {{ include "falcon-sensor.fullname" . }}-test-sa
  restartPolicy: Never
{{- end -}}
{{- end -}}
