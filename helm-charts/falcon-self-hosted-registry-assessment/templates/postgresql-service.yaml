{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ra-self-hosted.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ra-self-hosted.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "ra-self-hosted.postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.postgresql.primary.service.ports.postgresql | default 5432 }}
      targetPort: postgresql
      name: postgresql
{{- end }}
