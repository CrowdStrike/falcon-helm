{{- if .Values.postgresql.enabled }}
{{- if not .Values.postgresql.auth.password }}
{{- fail "postgresql.auth.password is required when postgresql.enabled=true (the official postgres image exits immediately on an empty POSTGRES_PASSWORD)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ra-self-hosted.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ra-self-hosted.postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
